[project]
name = "gracedb-mcp"
version = "0.2.0"
description = "MCP server exposing LIGO/Virgo gravitational-wave alerts (GraceDB) to LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "izabelamaria24" }]
keywords = ["mcp", "gravitational-waves", "ligo", "virgo", "gracedb", "astrophysics"]

dependencies = [
    "mcp>=2.0.0",
    "ligo-gracedb>=2.11.0",
    "gwosc>=0.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Strain data lives at GWOSC, not GraceDB. gwpy is only needed for download_strain_data.
strain = ["gwpy>=3.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

# The experimental RL code is not published; install from a checkout with
# `pip install -e . --group rl` (pip >= 25.1).
[dependency-groups]
rl = ["gwpy>=3.0.0", "gymnasium>=1.0", "stable-baselines3>=2.3", "lalsuite>=7.0"]

[project.scripts]
gracedb-mcp = "gracedb_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gracedb_mcp"]
# Editable installs put all of src/ on the path, so gw_rl still imports from a checkout.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
exclude = ["src/gw_rl", "scripts", "tests/test_rl_env.py", "data"]

[tool.ruff]
line-length = 100
target-version = "py310"

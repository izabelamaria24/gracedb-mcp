name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,strain]"
      - run: pytest -q

  test-rl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # Dependency groups need pip >= 25.1. CPU-only torch keeps the install small.
      - run: python -m pip install -U pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]" --group rl
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: [strain, ""]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg EXTRAS=${{ matrix.extras }} -t gracedb-mcp:ci .
      - name: Check registry label
        run: |
          label=$(docker inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' gracedb-mcp:ci)
          test "$label" = "$(jq -r .name server.json)"
      - name: Server answers initialize over stdio
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 docker run --rm -i gracedb-mcp:ci | tee out.json
          jq -e '.result.serverInfo.name == "gracedb-mcp"' out.json
      - name: Strain support matches the variant
        run: |
          docker run --rm --entrypoint python gracedb-mcp:ci -c "
          import importlib.util as u
          assert (u.find_spec('gwpy') is not None) == ('${{ matrix.extras }}' == 'strain')
          "

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit ".[strain]"
      - run: pip-audit --skip-editable

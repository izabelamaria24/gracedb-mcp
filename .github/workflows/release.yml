name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches pyproject.toml and server.json
        run: |
          python - <<'EOF'
          import json, os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          server = json.load(open("server.json"))
          # OCI packages carry their version in the image tag instead of a version field.
          packages = {p.get("version") or p["identifier"].rsplit(":", 1)[1] for p in server["packages"]}
          found = {project, server["version"], *packages}
          if found != {tag}:
              raise SystemExit(f"tag {tag} does not match versions {found}")
          EOF
      - run: pip install -e ".[dev,strain]" build
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io with GITHUB_TOKEN
    env:
      IMAGE: ghcr.io/izabelamaria24/gracedb-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image is publicly pullable
        # The MCP Registry pulls anonymously; a new GHCR package starts out private.
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "$IMAGE:${GITHUB_REF_NAME#v}" > /dev/null; then
            echo "::error::$IMAGE is not public. Set it to Public under the package settings on GitHub, then re-run failed jobs."
            exit 1
          fi

  mcp-registry:
    needs: [pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # registry login via GitHub OIDC
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        # The registry reads the README from PyPI, which can take a minute to appear.
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
